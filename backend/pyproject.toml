[project]
name = "drug-discovery-pipeline"
version = "0.1.0"
description = "Agentic drug candidate discovery pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=0.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "biopython>=1.84",
    "rdkit>=2024.3.5",
    "py3Dmol>=2.4",
]

[project.optional-dependencies]
docking = ["vina>=1.2.5"]

[tool.uv]
package = false
